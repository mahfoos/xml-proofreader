[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "xml-proofreader"
version = "0.1.0"
description = "Proofread the <p> elements of an XML file with a GenAI model and annotate errors in place."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.3,<3",
    "pydantic>=2.14,<3",
    "python-docx>=1.2,<2",
    "python-dotenv>=1.2,<2",
]

[project.optional-dependencies]
dev = ["pytest>=9.1", "ruff>=0.17,<0.18", "pyright>=1.1.414"]

[project.scripts]
xml-proofread = "xml_proofreader.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
preview = true
explicit-preview-rules = true
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C4", "PT", "N", "ANN", "D", "DOC201", "DOC501"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D1", "DOC201", "DOC501"]

[tool.pyright]
include = ["src", "tests"]
venvPath = "."
venv = ".venv"
