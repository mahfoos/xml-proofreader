[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "xml-proofreader"
version = "0.1.0"
description = "Proofread the <p> elements of an XML file with a GenAI model and annotate errors in place."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.3,<3",
    "pydantic>=2.14,<3",
    "python-docx>=1.2,<2",
]

[project.optional-dependencies]
dev = ["pytest>=9.1"]

[project.scripts]
xml-proofread = "xml_proofreader.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
