[build-system]
# setuptools 64 is the first release that supports editable installs (pip install -e .).
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "xml-proofreader"
version = "0.1.0"
description = "Proofread the <p> elements of an XML file with a GenAI model and annotate errors in place."
readme = "README.md"
requires-python = ">=3.11"
# Lower bound: the version this project was built and tested with.
# Upper bound: the next major release, which is allowed to break the API.
dependencies = [
    "anthropic>=2.3,<3",    # Claude API client
    "pydantic>=2.14,<3",    # schema for the model's structured findings
    "python-docx>=1.2,<2",  # reads the style guide .docx
]

[project.optional-dependencies]
# Development-only tools, installed with: pip install -e ".[dev]"
dev = ["pytest>=9.1"]

[project.scripts]
# Creates an `xml-proofread` command that runs main() in src/xml_proofreader/cli.py.
xml-proofread = "xml_proofreader.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
